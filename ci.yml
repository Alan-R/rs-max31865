name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings  # Fail on warnings

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Default (no features)"
            features: ""
          - name: "Mock enabled"
            features: "mock"
          - name: "Mock + no_fp (integer-only)"
            features: "mock no_fp"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy linting
        run: cargo clippy --all-targets --${{ matrix.features }} -- -D warnings

      - name: Run tests
        run: cargo test --verbose --${{ matrix.features }} -- --test-threads=1

      - name: Run doc tests
        run: cargo test --doc --${{ matrix.features }} --no-fail-fast

  coverage:
    name: Code Coverage (Mock)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only on main push
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview  # Needed for llvm-cov

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Cache Cargo registry & build
        uses: swatinem/rust-cache@v2

      - name: Generate coverage report
        run: |
          cargo llvm-cov --features mock --html --output-dir coverage-report
          cargo llvm-cov --features mock --lcov --output-path lcov.info  # For Codecov if you add it

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 7  # Keep for a week

      - name: Upload lcov to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # Set in repo Settings > Secrets